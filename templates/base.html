<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#783b2f">
  <title>{% block titolo %}Da Mario{% endblock %} · Trattoria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#contenuto">Vai al contenuto</a>
  <header class="site-header">
    <nav class="container site-nav" aria-label="Navigazione principale">
      <a class="brand" href="/" aria-label="Trattoria Da Mario, menù">
        <span class="brand-mark" aria-hidden="true">m.</span>
        <span class="brand-name">Da Mario<small>TRATTORIA ITALIANA</small></span>
      </a>
      <div class="nav-links">
        <a class="nav-item {% if pagina_attiva == 'menu' %}active{% endif %}" href="/" {% if pagina_attiva == 'menu' %}aria-current="page"{% endif %}>Menù</a>
        <a class="nav-item {% if pagina_attiva == 'tavoli' %}active{% endif %}" href="/tavoli" {% if pagina_attiva == 'tavoli' %}aria-current="page"{% endif %}>Tavoli</a>
        <a class="nav-item {% if pagina_attiva == 'cucina' %}active{% endif %}" href="/cucina" {% if pagina_attiva == 'cucina' %}aria-current="page"{% endif %}>Cucina</a>
        <a class="nav-item {% if pagina_attiva == 'statistiche' %}active{% endif %}" href="/statistiche" {% if pagina_attiva == 'statistiche' %}aria-current="page"{% endif %}>Statistiche</a>
      </div>
    </nav>
  </header>
  <main class="container page-content" id="contenuto">
    {% block contenuto %}
    <section class="empty-state error-state">
      <span class="eyebrow">TRATTORIA DA MARIO</span>
      <h1>{{ titolo_errore }}</h1><p>{{ messaggio_errore }}</p>
      <a class="btn btn-primary" href="/">Torna al menù <span aria-hidden="true">→</span></a>
    </section>
    {% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div><strong>Da Mario</strong><span>La buona cucina, con semplicità.</span></div>
      <p>Progetto di: Studente A, Studente B, Studente C</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
